<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Portfolio</title>
<meta name="description" content="Get in touch — I'm open to new opportunities.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact" class="page">

<main>
  <section id="contact">
    <div class="wrap">
      <div class="head reveal">
        <h2>Get in touch</h2>
        <p id="contactSub"></p>
      </div>
      <div class="contact-grid">
        <div class="contact-info reveal">
          <h3>Let's connect</h3>
          <p id="contactBlurb"></p>
          <div id="contactList"></div>
          <h3 style="font-size:1.15rem;margin-top:34px">Follow me</h3>
          <div class="socials" style="justify-content:flex-start" id="contactSocials"></div>
        </div>
        <div class="form-box reveal">
          <h3>Send a message</h3>
          <form id="form">
            <div class="field">
              <label for="f-name">Full name *</label>
              <input id="f-name" required placeholder="Your full name">
            </div>
            <div class="field">
              <label for="f-email">Email address *</label>
              <input id="f-email" type="email" required placeholder="you@example.com">
            </div>
            <div class="field">
              <label for="f-subject">Subject *</label>
              <input id="f-subject" required placeholder="What's this about?">
            </div>
            <div class="field">
              <label for="f-msg">Message *</label>
              <textarea id="f-msg" required placeholder="Tell me about your project or inquiry..."></textarea>
            </div>
            <button class="btn" type="submit">Send message</button>
            <p class="form-note">Opens in your email app — no server needed.</p>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="data.js"></script>
<script src="main.js"></script>
</body>
</html>
